[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlp-reasoner"
version = "0.1.0"
description = "Description Logic Programs from Raphael Volz's 2004 thesis"
requires-python = ">=3.11"
dependencies = ["rdflib>=7.1,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "owlrl>=7,<8", "ruff>=0.12,<1"]

[project.scripts]
dlp = "dlp_reasoner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_reasoner"]
